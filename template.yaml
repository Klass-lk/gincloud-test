AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  testproject

Globals:
  Function:
    Timeout: 10
    MemorySize: 128

Resources:
  testprojectAPI:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod

  testprojectFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: bootstrap
      Runtime: provided.al2
      Architectures:
        - x86_64
      Events:
        ApiEvents:
          Type: Api
          Properties:
            Path: /{proxy+}
            Method: ANY
            RestApiId: !Ref testprojectAPI
      Environment:
        Variables:
          STAGE: prod
    Metadata:
      BuildMethod: makefile

Outputs:
  testprojectEndpoint:
    Description: API Gateway testproject Endpoint
    Value:
      Fn::Sub: https://${testprojectAPI}.execute-api.${AWS::Region}.amazonaws.com/prod