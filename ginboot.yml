ginboot:
  server:
    port: env(PORT, 8080)
    base-path: /api

  services:
    user-service:
      url: ${SERVICE_USER_SERVICE_URL:http://localhost:8081}
      timeout: 5s

  db:
    driver: none
    url: ${DATABASE_URL:mongodb://localhost:27017}

  telemetry:
    enabled: true
    service-name: testproject
    exporter: otlp
    endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:localhost:4317}
